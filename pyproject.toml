[project]
name = "download-curator"
version = "0.1.0"
description = "A safe, AI-assisted macOS download organizer with propose-review-approve architecture"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0.0",
    "typer>=0.12.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.7.0",
    "watchdog>=4.0.0",
    "pypdf>=4.2.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.2",
    "python-pptx>=0.6.23",
    "pillow>=10.3.0",
    "httpx>=0.27.0",
]

[project.scripts]
download-curator = "download_curator.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/download_curator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
